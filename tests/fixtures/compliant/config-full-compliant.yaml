test_name: "Full Compliant Configuration"
description: "This configuration passes all HIPAA, Auto-Update, SSH Key Audit, and Unapproved Software checks"

security:
  encryption_at_rest:
    encryption: enabled
    encrypt_at_rest: true
    kms_key_id: "arn:aws:kms:us-east-1:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab"
  
  audit_controls:
    audit_log: enabled
    cloudtrail: enabled
    logging: true
    audit_enabled: true
  
  authentication:
    mfa_enabled: true
    require_mfa: true
    multi_factor: true
  
  encryption_in_transit:
    tls: enabled
    tls_version: "1.3"
    https_only: true
    enforce_ssl: true
  
  user_management:
    unique_user_id: true
    iam_enabled: true
    individual_accounts: true
  
  backup:
    backup_enabled: true
    automated_backup: true
    disaster_recovery: enabled
  
  access_control:
    access_termination: automated
    offboarding: enabled
  
  session_management:
    auto_logoff: enabled
    session_timeout: 15
    idle_timeout: 900

auto_update:
  auto_update: enabled
  automatic_updates: true
  unattended_upgrades: enabled
  security_updates_only: true
  update_type: security
  update_schedule: weekly
  maintenance_window: sunday-02:00
  reboot_after_update: true
  auto_reboot: scheduled
  update_notifications: enabled
  patch_alerts: true

ssh_hardening:
  ssh_password_auth: disabled
  password_authentication: false
  ssh_root_login: disabled
  permit_root_login: false
  ssh_key_rotation: enabled
  key_rotation_days: 90
  ssh_key_algorithm: ed25519
  strong_ssh_keys: true
  ssh_passphrase_required: true
  authorized_keys_managed: true
  ssh_ca: enabled

software_controls:
  software_whitelist: enabled
  application_allowlist: true
  software_inventory: enabled
  asset_inventory: maintained
  software_install_policy: restricted
  admin_only_install: true
  software_scan: enabled
  unapproved_software_scan: true
  software_removal_policy: defined
  auto_remove_unapproved: true
